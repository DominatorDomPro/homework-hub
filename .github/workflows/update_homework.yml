name: Auto-Update Homework Hub

on:
  # Runs automatically every day at 6:00 AM EST (11:00 UTC) and 6:00 PM EST (23:00 UTC)
  schedule:
    - cron: '0 11,23 * * *'
  
  # Adds a manual "Run workflow" button in the Actions tab so you can test anytime!
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. Install Python packages & Playwright Chromium
        run: |
          pip install playwright google-genai pydantic pypdf python-docx
          playwright install --with-deps chromium

      - name: 4. Restore auth.json login session from GitHub Secrets
        env:
          AUTH_SECRET: ${{ secrets.AUTH_JSON }}
        run: |
          echo "$AUTH_SECRET" > auth.json

      - name: 5. Run Homework Bot & Update Web App
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_ACTIONS: "true"
        run: |
          python homework_bot.py
